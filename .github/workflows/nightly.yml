name: Nightly Wagtail Test

on:
  schedule:
    - cron: '0 1 * * *'
    # At 01:00, daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-wagtail-test:
    runs-on: ubuntu-latest
    env:
      WEBHOOK_EXISTS: ${{ secrets.SLACK_WEBHOOK_URL != '' }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Install Node dependencies
        run: npm ci

      - name: Build static files
        run: ./node_modules/.bin/webpack --mode production

      - uses: astral-sh/setup-uv@v3

      - run: git clone https://github.com/wagtail/wagtail.git ../wagtail

      - run: uv sync --extra testing
      - run: uv pip install ../wagtail

      - run: uv run pytest

      - name: Report failure
        run: |
          uv pip install requests
          uv run python ./.github/scripts/report_nightly_build_failure.py
        if: ${{ failure() && env.WEBHOOK_EXISTS == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
