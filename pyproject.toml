[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[project]
name = "wagtail-ai"
version = "4.0.0"
authors = [{name = "Tom Usher", email = "tom@tomusher.com"}]
description = "Get a hand writing your content with AI super powers!"
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 7",
]
dependencies = [
    "Django>=5.2",
    "Wagtail>=7.4",
    "django-ai-core",
    "llm>=0.12",
]
requires-python = ">=3.11"

[project.optional-dependencies]
testing = [
    "beautifulsoup4>=4.11",
    "dj-database-url>=3.1.2",
    "django-types>=0.18.0",
    "pytest>=8.1.1",
    "pytest-django>=4.12.0",
    "pytest-mock>=3.12.0",
    "wagtail-factories>=4.1.0",
    "factory-boy>=3.3.0",
    "coverage>=7.4.0",
]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.4.5",
    "mkdocs-awesome-pages-plugin>=2.9.2"
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.11",
    "dj-database-url>=3.1.2",
    "django-types>=0.18.0",
    "pre-commit>=3.6.0",
    "pytest>=8.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "pytest-mock>=3.12.0",
    "wagtail-factories>=4.1.0",
    "factory-boy>=3.3.0",
    "coverage>=7.4.0",
    "ruff>=0.15.9",
]

[project.urls]
Homepage = "https://github.com/wagtail/wagtail-ai"
Repository = "https://github.com/wagtail/wagtail-ai"
Changelog = "https://github.com/wagtail/wagtail-ai/blob/main/CHANGELOG.md"
Documentation = "https://wagtail-ai.readthedocs.io/"
Issues = "https://github.com/wagtail/wagtail-ai/issues"

[tool.uv.build-backend]
module-name = "wagtail_ai"
source-exclude = [
    "wagtail_ai/static_src",
    "wagtail_ai/static/wagtail_ai/js/.gitignore",
    "testmanage.py",
    ".*",
    "*.js",
    "*.json",
    "*.ini",
    "*.yml",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "testapp.settings"
pythonpath = ["./", "./tests"]
testpaths = ["tests"]

[tool.pyright]
include = ["src/**"]
exclude = ["**/migrations", ".tox/**", ".venv", "venv/**", "node_modules/**"]
venvPath = ".venv"
venv = ".venv"
pythonVersion = "3.11"
pythonPlatform = "Linux"
